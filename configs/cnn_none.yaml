# CNN baseline: WILDS reference protocol for Camelyon17 (ERM), no color handling.
# Source: wilds/examples/configs/datasets.py ("camelyon17") and algorithm.py ("ERM").
name: cnn_none
model: densenet121        # torchvision, trained from scratch (no pretraining)
color: none               # none | hed | macenko (Phase 4)
epochs: 10
batch_size: 32
lr: 0.001                 # SGD, no learning-rate schedule
momentum: 0.9
weight_decay: 0.01
eval_batch_size: 256      # inference only: does not change the results
num_workers: 4
amp: false                # mixed precision (CUDA only): decided after the benchmark
